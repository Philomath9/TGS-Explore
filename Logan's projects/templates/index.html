<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable Tic-Tac-Toe AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .message {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 16px;
            height: 24px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 30px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 10px;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(.disabled) {
            background: #f9f9f9;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .cell.x {
            color: #667eea;
            font-weight: bold;
            cursor: not-allowed;
        }

        .cell.o {
            color: #764ba2;
            font-weight: bold;
            cursor: not-allowed;
        }

        .cell.disabled {
            cursor: not-allowed;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .btn-new {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .btn-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-new:active {
            transform: translateY(0);
        }

        .stats {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            color: #666;
            font-size: 14px;
        }

        .winner-message {
            font-size: 18px;
            color: #764ba2;
            font-weight: bold;
            margin-top: 10px;
        }

        .ai-thinking {
            display: inline-block;
            margin-left: 5px;
        }

        .dot {
            animation: dot 1.5s steps(3, end) infinite;
        }

        @keyframes dot {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Tic-Tac-Toe AI</h1>
        <p class="subtitle">Can you beat the unbeatable AI?</p>
        
        <div class="message" id="message">Loading...</div>

        <div class="board" id="board">
            <!-- Cells generated by JavaScript -->
        </div>

        <div class="buttons">
            <button class="btn-new" onclick="resetGame()">New Game</button>
        </div>

        <div class="stats">
            <p>🟦 You are X (Blue) | 🟪 AI is O (Purple)</p>
            <p>The AI uses the Minimax algorithm - it's mathematically unbeatable!</p>
        </div>
    </div>

    <script>
        const HUMAN = -1;
        const AI = 1;
        const EMPTY = 0;

        let gameState = null;

        async function loadGame() {
            try {
                const response = await fetch('/api/game');
                gameState = await response.json();
                renderBoard();
                updateMessage();
            } catch (error) {
                console.error('Error loading game:', error);
                document.getElementById('message').textContent = 'Connection error';
            }
        }

        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const cell = document.createElement('button');
                    cell.className = 'cell';
                    
                    const value = gameState.board[row][col];
                    if (value === HUMAN) {
                        cell.textContent = 'X';
                        cell.classList.add('x', 'disabled');
                    } else if (value === AI) {
                        cell.textContent = 'O';
                        cell.classList.add('o', 'disabled');
                    } else {
                        cell.textContent = '';
                    }

                    if (!gameState.game_over && value === EMPTY) {
                        cell.onclick = () => makeMove(row, col);
                    } else {
                        cell.classList.add('disabled');
                    }

                    boardDiv.appendChild(cell);
                }
            }
        }

        function updateMessage() {
            const messageDiv = document.getElementById('message');
            
            if (gameState.game_over) {
                messageDiv.innerHTML = gameState.message;
                if (gameState.winner === 'human') {
                    messageDiv.innerHTML += ' 🎉';
                } else if (gameState.winner === 'ai') {
                    messageDiv.innerHTML += ' 🤖';
                } else if (gameState.winner === 'draw') {
                    messageDiv.innerHTML += ' 🤝';
                }
            } else {
                messageDiv.textContent = gameState.message;
            }
        }

        async function makeMove(row, col) {
            if (gameState.game_over) return;

            // Disable clicks during AI thinking
            document.getElementById('board').style.pointerEvents = 'none';
            document.getElementById('message').textContent = 'AI is thinking...';

            try {
                const response = await fetch('/api/move', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ row, col })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(error.error || 'Invalid move');
                } else {
                    gameState = await response.json();
                    renderBoard();
                    updateMessage();
                }
            } catch (error) {
                console.error('Error making move:', error);
                alert('Error making move');
            }

            document.getElementById('board').style.pointerEvents = 'auto';
        }

        async function resetGame() {
            try {
                const response = await fetch('/api/reset', { method: 'POST' });
                gameState = await response.json();
                renderBoard();
                updateMessage();
            } catch (error) {
                console.error('Error resetting game:', error);
            }
        }

        // Initialize game on page load
        loadGame();
    </script>
</body>
</html>
